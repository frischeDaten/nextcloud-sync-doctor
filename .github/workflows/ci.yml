name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Byte-compile everything
        run: python -m compileall -q ncsd

      - name: CLI works without a Nextcloud account
        run: python -m ncsd --version

      - name: Demo scan (no client, no server, no network)
        run: python -m ncsd --demo scan

      - name: Demo scan as JSON
        run: python -m ncsd --demo scan --json

      - name: Build a wheel and install it
        # --find-links instead of a glob: PowerShell does not expand wildcards,
        # so "pip install dist/*.whl" fails on the Windows runners.
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
          python -m pip install --no-index --find-links dist nextcloud-sync-doctor

      - name: The installed entry point works
        run: ncsd --demo scan

      - name: Static assets shipped with the package
        run: python -c "import os, ncsd.webui as w; assert os.path.isfile(os.path.join(w.STATIC_DIR, 'index.html')), w.STATIC_DIR"

  macos:
    name: macOS specifics
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Platform detection and macOS paths
        run: python -c "import ncsd.platform as p; assert p.is_macos() and p.platform_name() == 'macos'; print(p.config_candidates()[0].path)"

      - name: Keychain attribute parsing (no keychain needed)
        run: python -m unittest discover -s tests -v

      - name: Launcher is executable and LF-only
        run: |
          test -x "Nextcloud Sync Doctor.command"
          if grep -q $'\r' "Nextcloud Sync Doctor.command"; then
            echo "launcher contains CRLF"; exit 1
          fi
          bash -n "Nextcloud Sync Doctor.command"

      - name: Demo scan through the launcher
        # --no-browser belongs to "serve"; a subcommand is passed through, so keep
        # this to options the "scan" subcommand accepts.
        run: ./"Nextcloud Sync Doctor.command" --demo scan
