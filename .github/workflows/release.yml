name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # The bundle is the same on every platform (byte-reproducible), but each platform gets
  # a ZIP whose launcher has the right name and executable bit. The macOS one is built
  # on macOS so it can be unpacked and really run there before it is published.
  bundle:
    name: Build the bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: windows
            os: windows-latest
            launcher: Nextcloud Sync Doctor.cmd
          - platform: macos
            os: macos-latest
            launcher: Nextcloud Sync Doctor.command
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the bundle
        run: python tools/build_release.py

      - name: Verify the bundle by unpacking and running it
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(ls dist/*.zip)"
          # unzip keeps the executable bit of the macOS launcher, like Finder does;
          # "python -m zipfile -e" drops it, so it would not test what users get.
          mkdir -p dist/unpacked
          unzip -q "$ZIP" -d dist/unpacked
          BUNDLE="$(ls -d dist/unpacked/nextcloud-sync-doctor-*/ | head -1)"
          echo "bundle: $BUNDLE"
          cd "$BUNDLE"
          python -m ncsd --version
          python -m ncsd --demo scan
          test -f "Nextcloud Sync Doctor.cmd"
          test -f "Nextcloud Sync Doctor.command"
          test -f ncsd/static/index.html
          test -f ncsd/static/app.js
          echo "bundle contents ok"

      - name: Run the macOS launcher from the unpacked ZIP
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="$(ls -d dist/unpacked/nextcloud-sync-doctor-*/ | head -1)"
          cd "$BUNDLE"
          # unzip keeps the executable bit, like Finder; verify that and run it.
          test -x "Nextcloud Sync Doctor.command"
          ./"Nextcloud Sync Doctor.command" --demo scan | tee launcher.txt
          grep -q 'real problem(s)' launcher.txt

      - name: Run the Windows launcher from the unpacked ZIP
        if: matrix.platform == 'windows'
        shell: cmd
        run: |
          rem errorlevel inside a ( ) block is evaluated when the block is parsed,
          rem so each command is guarded on its own line.
          for /d %%D in (dist\unpacked\nextcloud-sync-doctor-*) do (
            cd "%%~fD"
            "Nextcloud Sync Doctor.cmd" --demo scan > launcher.txt || exit /b 1
            findstr /c:"real problem(s)" launcher.txt >nul || exit /b 1
            echo launcher ok
          )

      - name: Name the ZIP for this platform
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import ncsd; print(ncsd.__version__)')"
          SRC="dist/nextcloud-sync-doctor-${VERSION}.zip"
          test -f "$SRC"
          if [ "${{ matrix.platform }}" = macos ]; then
            mv "$SRC" "dist/nextcloud-sync-doctor-${VERSION}-macos.zip"
          fi
          ls -l dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
  release:
    name: Publish the release
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          WIN_ZIP="dist/nextcloud-sync-doctor-${VERSION}.zip"
          MAC_ZIP="dist/nextcloud-sync-doctor-${VERSION}-macos.zip"
          test -f "$WIN_ZIP"
          test -f "$MAC_ZIP"
          WIN_SHA="$(sha256sum "$WIN_ZIP" | awk '{print $1}')"
          MAC_SHA="$(sha256sum "$MAC_ZIP" | awk '{print $1}')"
          WIN_SIZE="$(du -h "$WIN_ZIP" | cut -f1)"
          MAC_SIZE="$(du -h "$MAC_ZIP" | cut -f1)"

          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ]; then
            CHANGES="$(git log --oneline "${PREV}..${TAG}")"
          else
            CHANGES="$(git log --oneline "${TAG}")"
          fi

          cat > notes.md <<EOF
          ## Download

          Pick the ZIP for your system - no Git needed. Both contain the same program;
          only the launcher and its permissions differ.

          | System | File | Launcher inside |
          |---|---|---|
          | Windows | `nextcloud-sync-doctor-${VERSION}.zip` (${WIN_SIZE}) | `Nextcloud Sync Doctor.cmd` |
          | macOS | `nextcloud-sync-doctor-${VERSION}-macos.zip` (${MAC_SIZE}) | `Nextcloud Sync Doctor.command` |

          1. Download and unpack the ZIP anywhere (it contains a single folder).
          2. Windows: double-click **Nextcloud Sync Doctor.cmd** (SmartScreen: *More info ->
             Run anyway*). macOS: double-click **Nextcloud Sync Doctor.command** (if Finder
             refuses a downloaded script, right-click -> *Open*).
          3. Your browser opens on the local UI; press **Rescan**.

          Requires **Python 3.10 or newer**.

          **macOS needs Full Disk Access.** Since client 3.7 the macOS client is a sandboxed
          app and keeps its configuration, log and journal in
          `~/Library/Containers/com.nextcloud.desktopclient/Data`, which only processes with
          Full Disk Access may read. Grant it to the app you start the doctor from
          (*System Settings > Privacy & Security > Full Disk Access*), or pass
          `--config <nextcloud.cfg> --password <app-password>`. The launcher tells you when
          it is missing.

          Want to look around without touching your account? Run the launcher with `--demo`.

          Prefer a package? `pipx install git+https://github.com/${GITHUB_REPOSITORY}.git`,
          or `pip install -e .` from a checkout.

          ## Verify the download

          ```
          sha256  ${WIN_SHA}  nextcloud-sync-doctor-${VERSION}.zip
          sha256  ${MAC_SHA}  nextcloud-sync-doctor-${VERSION}-macos.zip
          ```

          ## What it does

          Shows the files that actually fail to sync - including names Windows cannot store,
          which the client cannot resolve on its own - with the local and the server version
          side by side. Keep local / keep server / keep both, rename on the server, restore
          server versions, delete to trash, ignore. On macOS it also finds Finder-trash
          leftovers, cloud placeholders and the FileProvider folder the client does not
          record in its configuration. Backups before every overwrite, full audit trail,
          local-only UI with a per-run token.

          `ncsd check` shows what the doctor can see on this machine and checks every file
          name against the client's rules without the server.

          Standard library only, no runtime dependencies. GPL-2.0-or-later.

          ## Changes

          ```
          ${CHANGES}
          ```
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, replacing the assets"
            gh release upload "$TAG" "$WIN_ZIP" "$MAC_ZIP" --clobber
          else
            gh release create "$TAG" "$WIN_ZIP" "$MAC_ZIP" \
              --title "Nextcloud Sync Doctor ${VERSION}" \
              --notes-file notes.md \
              --verify-tag
          fi
