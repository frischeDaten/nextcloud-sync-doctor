[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nextcloud-sync-doctor"
dynamic = ["version"]
description = "Find and fix Nextcloud Desktop sync problems file by file"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mathias Gorf" }]
keywords = ["nextcloud", "sync", "conflict", "windows", "webdav", "desktop-client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment :: File Managers",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
ncsd = "ncsd.cli:main"

[project.urls]
# Add these once the repository exists, e.g.:
# Homepage = "https://github.com/<owner>/nextcloud-sync-doctor"
# Issues = "https://github.com/<owner>/nextcloud-sync-doctor/issues"

[tool.setuptools]
# "ncsd.static" holds the HTML/CSS/JS and is listed so setuptools does not warn about
# an importable directory that is not part of any package.
packages = ["ncsd", "ncsd.static"]

[tool.setuptools.package-data]
ncsd = ["static/*"]

[tool.setuptools.dynamic]
version = { attr = "ncsd.__version__" }
